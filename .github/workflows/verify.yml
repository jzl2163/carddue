name: Verify CardDue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carddue
          POSTGRES_PASSWORD: carddue_test_only
          POSTGRES_DB: carddue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carddue -d carddue_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://carddue:carddue_test_only@localhost:5432/carddue_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.toml') }}
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile and run Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Export API contract
        run: cargo run --locked --bin carddue -- openapi > openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: openapi.json
          if-no-files-found: error
  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: api-contract
          path: frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate Rust-derived API types
        working-directory: frontend
        run: npm run api:generate
      - name: Type check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Install browser for frontend regression
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Overview and card form browser regression
        working-directory: frontend
        run: npm run test:e2e
      - name: Static production build
        working-directory: frontend
        run: npm run build
      - name: Check bundle budget
        working-directory: frontend
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: static-frontend
          path: frontend/build
          if-no-files-found: error
