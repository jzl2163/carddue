name: Verify CardDue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carddue
          POSTGRES_PASSWORD: carddue_test_only
          POSTGRES_DB: carddue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carddue -d carddue_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://carddue:carddue_test_only@localhost:5432/carddue_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - name: Compile and run Rust tests
        run: cargo test --workspace --all-targets
      - name: Export API contract
        run: cargo run --bin carddue -- openapi > openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: openapi.json
