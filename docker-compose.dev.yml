services:
  postgres:
    ports:
      - 127.0.0.1:5432:5432
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    security_opt:
      - no-new-privileges:true
